# TEMPLATE — Render Blueprint for Table's recommended private deployment (B9).
# Not active: Render only reads a Blueprint named render.yaml at the repository root (or a path you
# give it) when the owner creates a Blueprint in their own Render account. Copy it there only when
# provisioning has been explicitly approved. Creating these resources is billed (see DEPLOYMENT.md).
# Plan IDs and fields follow https://render.com/docs/blueprint-spec (read 2026-10-08).
services:
  - type: web
    name: table
    runtime: node
    plan: 0.5c-512mb            # "Starter": 0.5 CPU, 512 MB, $7/month (Hobby workspace)
    region: ohio               # choose once; cannot be changed later. Must match the database.
    numInstances: 1            # Table is a two-person app; one instance (see DEPLOYMENT.md "Processes")
    buildCommand: npm ci --include=dev && npx next build
    preDeployCommand: npm run db:migrate   # runs before the new release starts; a failure cancels the deploy
    startCommand: node_modules/.bin/next start -H 0.0.0.0   # no npm wrapper (~80 MB); Next reads the PORT Render provides
    healthCheckPath: /api/health           # 503 on missing/weak config, pending migrations or no database
    maxShutdownDelaySeconds: 120           # time for an in-flight request to finish; correctness does not depend on it (recovery marks an interrupted send uncertain)
    autoDeploy: false                      # deploy deliberately, after the verification workflow
    envVars:
      - key: NODE_VERSION
        value: 22.22.0                     # the runtime every verification run used
      - key: TABLE_ENV
        value: production
      - key: TABLE_RETAILER
        value: simulated                   # hosting never enables real cart writes
      - key: DATABASE_URL
        fromDatabase:
          name: table-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true                # random 256-bit value generated by Render; never in Git or chat
      - key: BETTER_AUTH_URL
        sync: false                        # the service's https origin, e.g. https://table-xxxx.onrender.com
      - key: FDC_API_KEY
        sync: false                        # optional (B7); leave empty until the household's own key exists
databases:
  - name: table-db
    plan: 0.1c-256mb                       # "Basic-256mb": $6/month
    region: ohio
    diskSizeGB: 1                          # $0.30/GB/month; the Basic default would be 15 GB
    postgresMajorVersion: "16"             # the version every verification run used
    ipAllowList: []                        # no external connections; the web service connects internally
